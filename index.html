<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Gradebook</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e1015'/%3E%3Crect x='6' y='7' width='20' height='18' rx='3' fill='none' stroke='%235b9dff' stroke-width='2.2'/%3E%3Cpath d='M6 13h20M13 7v18' stroke='%235b9dff' stroke-width='2.2'/%3E%3Cpath d='M16.5 19.5l2.5 2.5 4.5-5' fill='none' stroke='%233ecf8e' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#0e1015;--panel:#151922;--panel2:#1b202b;--panel3:#232a37;--line:#2b3240;--line2:#384154;--text:#e7eaf0;--muted:#9aa3b3;--dim:#6c7588;--accent:#5b9dff;--accent2:#3d7ee6;--green:#3ecf8e;--amber:#f0b429;--red:#ff6b6b;--chg:rgba(240,180,41,.22)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;margin-right:6px}
.clsWrap{display:flex;align-items:center;gap:8px}
.lbl{color:var(--muted);font-size:12px;letter-spacing:.04em}
select,input[type=text],input[type=number],input[type=search],input[type=email],textarea{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(91,157,255,.25)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:15px;height:15px;vertical-align:-2px}
input[type=number].sm{width:72px;padding:5px 8px}
#classSel{font-weight:600;min-width:220px;font-size:15px}
.btn{background:var(--panel3);border:1px solid var(--line2);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block;color:var(--text)}
.btn:hover{background:#2c3445}
.btn.primary{background:var(--accent2);border-color:var(--accent2);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent)}
.btn.danger{color:#ffb8b8;border-color:#5c2b2b;background:#2a1717}
.btn.danger:hover{background:#3a1d1d}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--panel3)}
.btn.small{padding:3px 9px;font-size:13px}
.btn:disabled,.btn[aria-disabled=true]{opacity:.4;cursor:default;pointer-events:none}
.grow{flex:1}
.savestate{font-size:12.5px;color:var(--muted)}
.savestate.warn{color:var(--amber);cursor:pointer;text-decoration:underline dotted}
.savestate.bad{color:var(--red)}
.tabs{display:flex;align-items:flex-end;gap:2px;padding:2px 16px 0;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
.tabs>button[data-view]{background:none;border:0;border-bottom:3px solid transparent;padding:8px 13px 9px;color:var(--muted);cursor:pointer;font-weight:600;font-size:14.5px;white-space:nowrap}
.tabs>button[data-view].on{color:var(--text);border-bottom-color:var(--accent)}
.tabs>button[data-view]:hover{color:var(--text)}
.tabs #keysBtn{margin-bottom:6px}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 16px;background:#2b2412;border-bottom:1px solid #7a5f17;color:#f5dfa6}
.banner[hidden]{display:none}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.view{display:none;flex:1;min-height:0;overflow:auto;padding:16px}
.view.on{display:block}
#v-grades.on{display:flex;flex-direction:column;padding:12px 16px 0;overflow:hidden}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:10px}
.search{position:relative}
.search input{width:200px;padding-right:30px}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);pointer-events:none}
kbd{font:12px ui-monospace,Menlo,Consolas,monospace;background:var(--panel3);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:13px;color:var(--muted)}
.chip:hover{color:var(--text)}
.chip.on{background:rgba(91,157,255,.18);border-color:var(--accent);color:var(--text)}
.chip b{margin-left:6px;color:var(--text)}
.ctl{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.ctl select{padding:5px 8px}
.gridwrap{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);scroll-padding:56px 0 0 400px;outline:none}
table.grid{border-collapse:separate;border-spacing:0;table-layout:fixed}
.grid th,.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 8px;height:34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid thead th{position:sticky;top:0;z-index:2;background:var(--panel2);height:54px;text-align:left;vertical-align:middle;cursor:pointer;user-select:none;font-weight:600;line-height:1.25}
.grid thead th:hover{background:var(--panel3)}
.grid .stu{position:sticky;left:0;z-index:1;background:var(--panel)}
.grid thead th.stu{z-index:3;background:var(--panel2)}
.grid .avg,.grid .crs{position:sticky;z-index:1;background:var(--panel);text-align:right;font-variant-numeric:tabular-nums}
.grid .avg{left:230px;color:var(--muted)}
.grid .crs{left:306px;border-right:2px solid var(--line2)}
.grid thead th.avg,.grid thead th.crs{z-index:3;background:var(--panel2);text-align:right}
.crs .lt{display:inline-block;min-width:16px;margin-left:6px;font-weight:700;color:var(--muted)}
.grid tbody th.stu{font-weight:400;text-align:left;line-height:1.15;cursor:pointer}
.grid tbody th.stu:hover .nm{text-decoration:underline}
.nm{display:block;overflow:hidden;text-overflow:ellipsis}
.un{display:block;font-size:11.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis}
.iname{overflow:hidden;text-overflow:ellipsis}
.imeta{font-size:11.5px;color:var(--dim);font-weight:400;overflow:hidden;text-overflow:ellipsis}
.grid td.cell{text-align:right;font-variant-numeric:tabular-nums;cursor:cell;position:relative}
.grid td.cell.text{text-align:left;color:#cdd3de}
.grid td.cell.ex{color:var(--muted);font-style:italic}
.grid td.changed{background:var(--chg)}
.grid td.over{color:var(--amber);font-weight:700}
.grid td.unexp::after{content:"";position:absolute;top:5px;left:5px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.grid td.hasnote::before{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 9px 9px 0;border-color:transparent var(--amber) transparent transparent}
.grid td.active{outline:2px solid var(--accent);outline-offset:-2px;background-color:rgba(91,157,255,.13)}
.grid td.changed.active{background:linear-gradient(rgba(91,157,255,.12),rgba(91,157,255,.12)),var(--chg)}
.grid tr.actrow th.stu{box-shadow:inset 3px 0 0 var(--accent);color:#fff}
.grid th.actcol{box-shadow:inset 0 -3px 0 var(--accent)}
.grid tr.dropped th.stu .nm{text-decoration:line-through;color:var(--dim)}
.grid td.editing{padding:0;outline:2px solid var(--accent);outline-offset:-2px}
.cellin{width:100%;height:100%;border:0!important;border-radius:0!important;background:#0b1a33!important;padding:0 8px!important;text-align:inherit;box-shadow:none!important}
.grid td.emptyrow{text-align:left;color:var(--muted);padding:18px;height:auto;white-space:normal;position:sticky;left:0}
.arrow{color:var(--accent);margin-left:4px;font-size:11px}
.statusbar{display:flex;gap:6px 14px;align-items:center;padding:8px 2px 10px;color:var(--muted);font-size:12.5px;flex-wrap:wrap}
.legend{display:inline-flex;align-items:center;gap:5px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line2)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.tri{display:inline-block;width:0;height:0;border-style:solid;border-width:0 9px 9px 0;border-color:transparent var(--amber) transparent transparent}
.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(480px,1fr));align-items:start;max-width:1600px}
.cards.stack{grid-template-columns:1fr;max-width:1180px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.card.full{grid-column:1/-1}
.card.hero{border-color:#2c4a7a}
.card h2{margin:0 0 4px;font-size:16px}
.card h3{margin:16px 0 6px;font-size:14px}
.card p.sub{margin:0 0 12px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tblwrap{overflow:auto;max-height:60vh;border:1px solid var(--line);border-radius:8px}
table.list{width:100%;border-collapse:collapse;font-size:13.5px}
table.list th,table.list td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.list thead th{color:var(--muted);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--panel2);z-index:1}
table.list thead th.sortable{cursor:pointer;user-select:none}
table.list thead th.sortable:hover{color:var(--text)}
table.list tr:last-child td{border-bottom:0}
table.list td.r,table.list th.r{text-align:right;white-space:nowrap}
table.list td:has(>b){white-space:nowrap}
table.list tr.dropped td{color:var(--dim)}
table.list tr.grp td{background:var(--panel2)}
table.list tr.sub td:first-child{padding-left:22px}
table.list tr.click{cursor:pointer}
table.list tr.click:hover td{background:var(--panel2)}
table.list input[type=text]{padding:4px 8px;width:100%;min-width:120px}
table.list select{padding:4px 6px}
.muted{color:var(--muted)}.dim{color:var(--dim)}.warn{color:var(--amber)}.ok{color:var(--green)}.bad{color:var(--red)}
code{font:12.5px ui-monospace,Menlo,Consolas,monospace;background:var(--panel2);padding:1px 5px;border-radius:5px;border:1px solid var(--line);word-break:break-all}
.tag{font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.tag.new{color:#a8cbff;border-color:#2c4a7a}
.tag.chg{color:var(--amber);border-color:#5a4718}
.tag.okk{color:var(--green);border-color:#1f4d3a}
.tag.sent{color:#a8cbff;border-color:#2c4a7a}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;display:inline-block}
.pill.risk{background:rgba(255,107,107,.16);color:#ff9d9d;border:1px solid #6b2e2e}
.pill.watch{background:rgba(240,180,41,.14);color:var(--amber);border:1px solid #5a4718}
.pill.ok{background:rgba(62,207,142,.12);color:var(--green);border:1px solid #1f4d3a}
.pill.none{color:var(--dim);border:1px solid var(--line2)}
.note{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:9px 12px;margin:10px 0;color:#cfd5df}
.note.warn{border-left-color:var(--amber)}
.drop{border:2px dashed var(--line2);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:14px;padding:0;max-width:min(620px,94vw);width:100%;box-shadow:0 20px 60px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg-h{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px}
.dlg-b{padding:16px 18px;max-height:72vh;overflow:auto}
.dlg-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field>span{font-size:12.5px;color:var(--muted);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg label,.seg button{padding:6px 12px;cursor:pointer;background:var(--panel2);display:flex;gap:6px;align-items:center;border:0;color:var(--muted)}
.seg label+label,.seg button+button{border-left:1px solid var(--line2)}
.seg input{display:none}
.seg label:has(input:checked),.seg button.on{background:rgba(91,157,255,.2);color:#fff}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(16px);opacity:0;pointer-events:none;background:#232a37;border:1px solid var(--line2);padding:10px 14px;border-radius:10px;display:flex;gap:12px;align-items:center;transition:.18s;max-width:86vw;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast.warn{border-color:#7a5f17;background:#2b2412}
.dropov{position:fixed;inset:0;background:rgba(14,16,21,.88);border:3px dashed var(--accent);display:none;align-items:center;justify-content:center;font-size:22px;font-weight:700;z-index:60;pointer-events:none}
.dropov.on{display:flex}
.empty{max-width:660px;margin:40px auto;text-align:center}
.empty h2{margin:0 0 8px}
.empty .row{justify-content:center;margin-top:16px}
.keys td:first-child{white-space:nowrap;padding-right:18px}
.keys td{padding:4px 0;vertical-align:top}
.help h3{margin:14px 0 4px;font-size:14px}
.help p,.help li{color:#cfd5df}
.help ul{padding-left:20px;margin:4px 0}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 14px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:110px}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{display:block;font-size:21px;font-variant-numeric:tabular-nums}
.stat small{display:block;font-size:11.5px;color:var(--dim)}
.stat.risk b{color:#ff9d9d}.stat.watch b{color:var(--amber)}
.dist{display:flex;align-items:flex-end;gap:6px;height:64px}
.dist div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;font-size:11.5px;color:var(--muted);height:100%;min-width:28px}
.dist i{display:block;width:22px;background:var(--accent2);border-radius:4px 4px 0 0;min-height:2px}
.emailgrid{display:grid;grid-template-columns:minmax(360px,1fr) minmax(420px,1.25fr);gap:16px;align-items:start;max-width:1600px}
@media (max-width:1050px){.emailgrid{grid-template-columns:1fr}}
textarea{width:100%;min-height:230px;resize:vertical;line-height:1.45}
.phs{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 10px}
.phs button{font:12px ui-monospace,Menlo,Consolas,monospace;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:2px 6px;color:var(--muted);cursor:pointer}
.phs button:hover{color:var(--text)}
.rlist{max-height:330px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.rrow{display:flex;gap:9px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.rrow:last-child{border-bottom:0}
.rrow.on{background:rgba(91,157,255,.09)}
.who{flex:1;min-width:0}
.who .em{display:block;font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis}
.who .em.none{color:var(--amber)}
.who .rnote{display:block;font-size:12px;color:var(--amber)}
.rcount{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12.5px;margin:8px 0 6px}
.draft{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;background:var(--panel2)}
.draft .body{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0 8px;font-size:13.5px;max-height:260px;overflow:auto}
details summary{cursor:pointer}
.elist{list-style:none;padding:0;margin:8px 0 0}
.elist li{display:flex;gap:8px;justify-content:space-between;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
/* student summary (screen) */
.sum h2{margin:0;font-size:19px}
.sum-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}
.sum-sub{color:var(--muted);font-size:13px;margin-top:2px}
.sum-cls{text-align:right;color:var(--muted);font-size:13px}
.sum-reasons{margin:0 0 12px;padding-left:20px;color:#cfd5df}
.sum-t{width:100%;border-collapse:collapse;font-size:13px}
.sum-t th,.sum-t td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
.sum-t th{color:var(--muted);font-size:12px;font-weight:600}
.sum-t .r{text-align:right;white-space:nowrap}
.sum-t tr.cat td{background:var(--panel2);font-weight:600}
.sum-t .miss{color:var(--amber)}
.sum-t .dropd{color:var(--dim);text-decoration:line-through}
.sum h3{font-size:14px;margin:16px 0 6px}
.sum ul.em{margin:0;padding-left:18px;font-size:13px;color:#cfd5df}
.sum-foot{color:var(--dim);font-size:11.5px;margin-top:14px}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true"><rect x="6" y="7" width="20" height="18" rx="3" fill="none" stroke="#5b9dff" stroke-width="2.2"/><path d="M6 13h20M13 7v18" stroke="#5b9dff" stroke-width="2.2"/><path d="M16.5 19.5l2.5 2.5 4.5-5" fill="none" stroke="#3ecf8e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Gradebook</span></div>
  <label class="clsWrap"><span class="lbl">Class</span><select id="classSel" title="Switch class (Alt+C)"></select></label>
  <button id="newClassBtn" class="btn">＋ New class</button>
  <div class="grow"></div>
  <span id="saveState" class="savestate"></span>
  <button id="helpBtn" class="btn ghost">Help</button>
</header>
<nav class="tabs" id="tabs">
  <button data-view="grades">Enter grades</button>
  <button data-view="course">Course grades</button>
  <button data-view="setup">Set up class</button>
  <button data-view="emails">Send emails</button>
  <button data-view="bs">Export &amp; import</button>
  <button data-view="data">Manage data</button>
  <div class="grow"></div>
  <button id="keysBtn" class="btn ghost small">⌨ Shortcuts <kbd>?</kbd></button>
</nav>
<div id="banner" class="banner" hidden></div>
<main>
  <section id="v-grades" class="view">
    <div id="gradesEmpty" class="empty" hidden></div>
    <div class="filters" id="filters">
      <div class="search"><input id="stuQ" type="search" placeholder="Find student" autocomplete="off" spellcheck="false"><kbd>/</kbd></div>
      <div class="search"><input id="itemQ" type="search" placeholder="Find items (comma = or)" autocomplete="off" spellcheck="false"><kbd>\</kbd></div>
      <div class="chips" id="catChips"></div>
      <label class="ctl">Only missing <select id="missingSel"></select></label>
      <label class="ctl" id="droppedCtl"><input type="checkbox" id="showDropped"> Show dropped</label>
      <button class="btn small ghost" id="clearF">Clear filters</button>
      <button class="btn small" id="resortBtn" hidden title="Put the rows back in sorted order (Alt+R)">↻ Re-sort</button>
    </div>
    <div class="gridwrap" id="gridwrap" tabindex="0"><table id="grid" class="grid"></table></div>
    <div class="statusbar" id="statusbar"></div>
  </section>
  <section id="v-course" class="view"></section>
  <section id="v-setup" class="view"></section>
  <section id="v-emails" class="view"></section>
  <section id="v-bs" class="view"></section>
  <section id="v-data" class="view"></section>
</main>
<div id="toast" class="toast" role="status"></div>
<div id="dropOverlay" class="dropov">Drop a Brightspace CSV to import, or a backup file to restore</div>
<input type="file" id="csvFile" accept=".csv,.txt,text/csv" hidden>
<input type="file" id="bakFile" accept=".json,application/json" hidden>

<script>
'use strict';
/* ================= Basics ================= */
const KEY = 'gradebook-v1', AUTO_KEY = KEY + ':auto', BAD_KEY = KEY + ':unreadable';
const VIEWS = ['grades', 'course', 'setup', 'emails', 'bs', 'data'];
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

function gridKey(e) {

function renderCourse() {

const SRC = {typed: 'typed', undo: 'undo', redo: 'redo', import: 'import', merge: 'merge', restore: 'restore', revert: 'revert', move: 'move'};
const PERIODS = {hour: ['Last hour', 36e5], today: ['Today', null], week: ['Last 7 days', 7 * 864e5], month: ['Last 30 days', 30 * 864e5], all: ['All', Infinity]};
const KINDS = {all: 'All changes', typed: 'Typed', undo: 'Undo / redo', batch: 'Imports & restores', fix: 'Reverts & moves', note: 'Notes'};
const curVal = (c, e) => e.k === 'n' ? (getNote(c, e.s, e.i)?.text || '') : getG(c, e.s, e.i);
/* Set cells to new values as one change: logged, undoable, marked as edited. */
function applyCells(c, changes, src, label) {
  const bt = uid(), t = Date.now(), undoEntry = [];
  for (const ch of changes) {
    if (!stuById(c, ch.sid) || !itemById(c, ch.iid)) continue;
    if (ch.k === 'n') {
      const old = getNote(c, ch.sid, ch.iid), nn = ch.to ? {text: ch.to, at: t} : null;
      if ((old?.text || '') === (ch.to || '')) continue;
      setNoteRaw(c, ch.sid, ch.iid, nn); logCell(c, ch.sid, ch.iid, 'n', old?.text, ch.to, src, bt, label);
      undoEntry.push({f: 'n', sid: ch.sid, iid: ch.iid, from: old, to: nn});
    } else {
      const old = getG(c, ch.sid, ch.iid); if (old === ch.to) continue;
      const k = ch.sid + '|' + ch.iid; if (c.id === DB.cur && !S.orig.has(k)) S.orig.set(k, old);
      const oldMod = getMod(c, ch.sid, ch.iid);
      setRaw(c, ch.sid, ch.iid, ch.to); setMod(c, ch.sid, ch.iid, t); logCell(c, ch.sid, ch.iid, 'g', old, ch.to, src, bt, label);
      undoEntry.push({f: 'g', sid: ch.sid, iid: ch.iid, from: old, to: ch.to, fromMod: oldMod, toMod: t});
    }
  }
  if (undoEntry.length && c.id === DB.cur) pushUndo(undoEntry);
  if (undoEntry.length) { DB.editsSinceBackup++; save(); setSaveState(); if (S.view === 'grades') renderGrid(); else if (S.view !== 'emails') renderView(); }
  return undoEntry.length;
}

function keepFocus(root, fn) {
  setTimeout(() => {
    const a = document.activeElement; let sel = null;
    if (a && root.contains(a)) {
      const tr = a.closest('tr[data-kid]');
      const attrs = ['data-k', 'data-cut', 'data-g', 'data-r', 'data-rn', 'data-rs'].filter(k => a.hasAttribute(k)).map(k => `[${k}="${a.getAttribute(k)}"]`).join('');
      if (attrs) sel = (tr ? `tr[data-kid="${tr.dataset.kid}"] ` : '') + attrs;
    }
    fn();
    if (sel) { const el = root.querySelector(sel); if (el) { el.focus(); if (el.select) el.select(); } }
  }, 0);
}
$('#v-setup').addEventListener('change', e => {
  const c = cls(); if (!c) return; const t = e.target; const G = c.grading;

  if (tr && t.dataset.k) {
    const k = G.cats.find(x => x.id === tr.dataset.kid); const f = t.dataset.k;
    if (f === 'name') {
      const nn = t.value.trim(); if (!nn) { t.value = k.name; return; }
      if (G.cats.some(x => x !== k && x.name === nn)) { toast(`There's already a category named “${nn}”`, {warn: true}); t.value = k.name; return; }
      for (const it of c.items) if (it.cat === k.name) it.cat = nn;

      k.name = nn;
    } else if (f === 'weight') k.weight = Math.max(0, +t.value || 0);
    else if (f === 'drop') k.drop = Math.max(0, Math.floor(+t.value || 0));
    else if (f === 'mode') k.mode = t.value;
    courseChanged(); keepFocus($('#v-setup'), renderSetup); return;
  }
  if (t.dataset.cut) { G.cut[t.dataset.cut] = Math.max(0, Math.min(100, +t.value || 0)); courseChanged(); keepFocus($('#v-setup'), renderSetup); return; }
  if (t.dataset.g === 'pass') { G.pass = t.value; courseChanged(); keepFocus($('#v-setup'), renderSetup); return; }
  if (t.dataset.r) { G.risk[t.dataset.r] = t.checked; G.risk.examSet = true; courseChanged(); return; }
  if (t.dataset.rn) { G.risk[t.dataset.rn] = Math.max(0, +t.value || 0); courseChanged(); return; }
  if (t.dataset.rs) { G.risk[t.dataset.rs] = t.value; G.risk.examSet = true; if (t.value) G.risk.exam = true; courseChanged(); keepFocus($('#v-setup'), renderSetup); return; }

/* ---- Recently deleted (30 days) ---- */
function binPut(kind, label, cid, data) { const e = {id: uid(), kind, at: Date.now(), cid, label, data}; DB.bin.push(e); return e; }
function restoreBin(id) {
  const e = DB.bin.find(x => x.id === id); if (!e) return false;
  const d = e.data; let msg = '';
  if (e.kind === 'class') {
    const x = fixClass(clone(d.cls)); if (DB.classes.some(k => k.id === x.id)) x.id = uid();
    if (DB.classes.some(k => normN(k.name) === normN(x.name))) x.name += ' (restored)';
    DB.classes.push(x); DB.cur = x.id; msg = `Restored the class ${x.name}`;
  } else if (e.kind === 'template') {
    const t = clone(d.t); if (d.edited || DB.templates.some(x => x.id === t.id)) { t.id = uid(); if (d.edited) t.title += ' (your edited version)'; }
    DB.templates.push(t); DB.removedStarters = DB.removedStarters.filter(x => x !== t.id); msg = `Restored the template “${t.title}”`;
  } else {
    const c = DB.classes.find(k => k.id === e.cid);
    if (!c) { toast(`The class “${d.cname}” no longer exists. Restore the class first.`, {warn: true}); return false; }
    if (e.kind === 'item') {
      const it = clone(d.item); if (c.items.some(x => x.id === it.id)) it.id = uid();
      if (c.items.some(x => normN(x.name) === normN(it.name))) it.name += ' (restored)';
      c.items.splice(Math.min(d.idx, c.items.length), 0, it);
      for (const sid in d.g) if (stuById(c, sid)) { setRaw(c, sid, it.id, d.g[sid]); setMod(c, sid, it.id, d.mod?.[sid] || 0); }
      for (const sid in (d.notes || {})) if (stuById(c, sid)) setNoteRaw(c, sid, it.id, d.notes[sid]);
      syncCats(c); msg = `Restored ${it.name}`;
    } else if (e.kind === 'student') {
      const s = clone(d.student);
      if (s.username && c.students.some(x => normU(x.username) === normU(s.username))) { toast(`${plainName(s)} can't be restored: another student in ${c.name} has the username ${dispUser(s)}.`, {warn: true}); return false; }
      if (c.students.some(x => x.id === s.id)) s.id = uid();
      c.students.push(s); sortStudents(c);
      for (const iid in (d.g || {})) if (itemById(c, iid)) { setRaw(c, s.id, iid, d.g[iid]); setMod(c, s.id, iid, d.mod?.[iid] || 0); }
      for (const iid in (d.notes || {})) if (itemById(c, iid)) setNoteRaw(c, s.id, iid, d.notes[iid]);
      msg = `Restored ${plainName(s)}`;
    }
    if (DB.cur !== c.id) { DB.cur = c.id; loadUI(); }
  }
  DB.bin = DB.bin.filter(x => x !== e); S.undo = []; S.redo = [];
  courseChanged(); renderAll(); toast(msg);
  return true;
}

function parseRoster(text) {
  const rows = parseCSV(text).filter(r => r.some(x => String(x).trim()));
  if (!rows.length) return [];
  const h = rows[0].map(x => fold(x).replace(/^#/, ''));
  const find = (...names) => h.findIndex(x => names.includes(x));
  const ix = {u: find('username', 'user name'), o: find('orgdefinedid', 'org defined id'), e: find('email', 'email address'), l: find('last name', 'lastname', 'last'), f: find('first name', 'firstname', 'first'), n: find('name', 'full name', 'student', 'student name'), r: find('role', 'role name')};
  const hasHdr = ['u', 'o', 'e', 'l', 'f', 'n'].some(k => ix[k] >= 0);
  if (!hasHdr) return rows.map(r => { const nm = splitName(r.map(x => x.trim()).filter(Boolean).join(', ')); return {...nm, username: '', orgId: '', email: ''}; }).filter(x => x.first || x.last);
  const g = (r, k) => ix[k] >= 0 ? String(r[ix[k]] ?? '').trim() : '';
  return rows.slice(1).filter(r => ix.r < 0 || !g(r, 'r') || /student|learner/i.test(g(r, 'r'))).map(r => {
    let first = g(r, 'f'), last = g(r, 'l'); if (!first && !last && ix.n >= 0) ({first, last} = splitName(g(r, 'n')));
    return {first, last, username: g(r, 'u'), orgId: g(r, 'o'), email: g(r, 'e')};
  }).filter(x => x.first || x.last || x.username || x.email);
}
function exactMatch(list, f) {
  const u = normU(f.username), o = fold(f.orgId).replace(/^#/, ''), e = fold(f.email), k = nameKey(f.first, f.last);
  return (u && list.find(s => normU(s.username) === u))
    || (o && list.find(s => fold(s.orgId).replace(/^#/, '') === o))
    || (e && list.find(s => fold(s.email) === e))
    || (k && list.find(s => nameKey(s.first, s.last) === k))
    || null;
}
function compareRoster(c, entries) {
  const used = new Set(), R = {matched: [], near: [], fresh: [], back: [], missing: []};
  const pending = [];
  for (const e of entries) {
    const s = exactMatch(c.students.filter(x => !used.has(x.id)), e);
    if (s) { used.add(s.id); (s.dropped ? R.back : R.matched).push({e, s, on: true}); } else pending.push(e);
  }
  for (const e of pending) {
    const s = c.students.find(x => !used.has(x.id) && !x.dropped && nameNear(x, e));
    if (s) { used.add(s.id); R.near.push({e, s, on: true}); } else R.fresh.push({e, on: true});
  }
  R.missing = c.students.filter(s => !s.dropped && !used.has(s.id)).map(s => ({s, on: true}));
  return R;
}

    body: `<p class="muted" style="margin-top:0">Compare a current class list with this class. A Brightspace classlist or grades export works, or paste names, one per line (“Last, First” or “First Last”). Students are matched by username, ID, email, then name (accents, order and extra surnames don't matter). Nothing changes until you apply.</p>
      <div class="row"><input type="file" id="dc-file" accept=".csv,.txt,text/csv"></div>
      <textarea id="dc-text" placeholder="…or paste names or CSV text here" style="margin-top:8px;min-height:90px"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn" id="dc-go">Compare</button></div><div id="dc-out"></div>`,
    buttons: [{label: 'Close'}, {label: 'Apply changes', primary: true, onClick: () => {
      if (!R) { toast('Choose a file or paste a list, then Compare', {warn: true}); return false; }
      const snap = JSON.stringify(c), now = Date.now(); let nd = 0, na = 0, nr = 0;
      for (const x of R.near) if (x.on) for (const k of ['username', 'orgId', 'email']) if (!x.s[k] && x.e[k]) x.s[k] = x.e[k];
      for (const x of R._miss) if (x.on) { x.s.dropped = true; x.s.droppedAt = now; nd++; }
      for (const x of R.back) if (x.on) { x.s.dropped = false; x.s.droppedAt = null; nr++; }
      for (const x of R._fresh) if (x.on) { c.students.push({id: uid(), dropped: false, first: x.e.first, last: x.e.last, username: x.e.username, orgId: x.e.orgId, email: x.e.email}); na++; }
      sortStudents(c); courseChanged(); renderView();
      toast(`Dropped ${nd}, added ${na}, restored ${nr}`, {action: {label: 'Undo', fn: () => restoreClassSnap(snap, 'Undo check for drops')}});
    }}],
    onOpen: d => {

function parseCSV(t) {
  t = String(t).replace(/^﻿/, '');
  const sep = (() => { const first = t.split(/\r?\n/, 1)[0] || ''; const n = ch => first.split(ch).length - 1; return n('\t') > n(',') && n('\t') > n(';') ? '\t' : n(';') > n(',') ? ';' : ','; })();
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"' && f.trim() === '') { q = true; f = ''; }
    else if (ch === sep) { row.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += ch;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows;
}
const csvCell = v => { v = String(v ?? ''); return /[",\r\n]|^\s|\s$/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };

const ID_COLS = {'orgdefinedid': 'orgId', 'username': 'username', 'last name': 'last', 'first name': 'first', 'email': 'email', 'end-of-line indicator': 'eol'};
function classifyHeader(h) {
  const m = h.match(/^(.*?)\s+(Points Grade|Text Grade|Grade Symbol|Scheme Symbol)\s*(?:<([^>]*)>)?\s*$/i);
  if (!m) return {skip: /final grade/i.test(h) ? 'final grade (calculated in Brightspace)' : 'not a grade item column'};
  const base = m[1].trim(), kind = m[2].toLowerCase(), tag = (m[3] || '').trim();
  if (kind === 'points grade') {
    if (/pass\s*\/\s*fail/i.test(tag)) return {skip: 'Pass/Fail item'};
    if (tag && !/^numeric/i.test(tag)) return {skip: tag.split(/\s/)[0] + ' item'};
    const mp = tag.match(/MaxPoints:\s*([\d.]+)/i);
    return {base, type: 'num', max: mp ? +mp[1] : null};
  }
  if (kind === 'text grade') return {base, type: 'text'};

function replaceDB(nd, src, label) {
  const oldHist = DB.hist, oldClasses = DB.classes;
  const incHist = nd.hist || {};
  DB = nd; DB.hist = oldHist;
  for (const c of DB.classes) { unionHist(histOf(c.id), incHist[c.id]); const o = oldClasses.find(k => k.id === c.id); if (o) logDiff(c, o, src, label); }
}
function findHere(x) { return DB.classes.find(k => k.id === x.id) || DB.classes.find(k => normN(k.name) === normN(x.name)) || null; }
function planMerge(here, inc) {
  const p = {here, inc, newStu: [], stuMap: new Map(), itemMap: new Map(), newItems: [], fills: 0, noteFills: 0, conflicts: [], drop: [], undrop: [], emails: 0};
  if (!here) return p;
  for (const s of inc.students) {
    const m = here.students.find(x => x.id === s.id) || matchStudent(here.students, s);
    if (m) { p.stuMap.set(s.id, m.id); if (s.dropped && !m.dropped) p.drop.push([s, m]); if (!s.dropped && m.dropped) p.undrop.push([s, m]); }
    else p.newStu.push(s);
  }
  for (const it of inc.items) {
    const m = here.items.find(x => x.id === it.id) || here.items.find(x => x.type === it.type && normN(x.name) === normN(it.name)) || (it.bsName && here.items.find(x => x.type === it.type && x.bsName && normN(x.bsName) === normN(it.bsName)));
    if (m) p.itemMap.set(it.id, m.id); else p.newItems.push(it);
  }
  for (const s of inc.students) {
    const hs = p.stuMap.get(s.id);
    for (const it of inc.items) {
      const hi = p.itemMap.get(it.id), v = getG(inc, s.id, it.id), n = getNote(inc, s.id, it.id);
      if (v !== '') {
        if (!hs || !hi) p.fills++;
        else { const hv = getG(here, hs, hi);
          if (hv === '') p.fills++;
          else if (hv !== v && !(it.type === 'num' && isScore(hv) && isScore(v) && +hv === +v)) p.conflicts.push({key: `g|${s.id}|${it.id}`, f: 'g', s, it, hs, hi, here: hv, inc: v, hereAt: getMod(here, hs, hi), incAt: getMod(inc, s.id, it.id)}); }
      }
      if (n) {
        if (!hs || !hi) p.noteFills++;
        else { const hn = getNote(here, hs, hi);
          if (!hn) p.noteFills++;
          else if (hn.text !== n.text) p.conflicts.push({key: `n|${s.id}|${it.id}`, f: 'n', s, it, hs, hi, here: hn.text, inc: n.text, hereAt: hn.at || 0, incAt: n.at || 0}); }
      }
    }
  }
  p.emails = inc.emails.filter(e => !here.emails.some(x => x.id === e.id)).length;
  return p;
}
function applyMerge(p, choice, opts) {
  const inc = p.inc;
  if (!p.here) { const x = fixClass(clone(inc)); if (DB.classes.some(k => normN(k.name) === normN(x.name))) x.name += ' (restored)'; DB.classes.push(x); return; }
  const c = p.here;
  for (const s of p.newStu) { const ns = clone(s); if (c.students.some(x => x.id === ns.id)) ns.id = uid(); c.students.push(ns); p.stuMap.set(s.id, ns.id); }
  for (const it of p.newItems) { const ni = clone(it); if (c.items.some(x => x.id === ni.id)) ni.id = uid(); c.items.push(ni); p.itemMap.set(it.id, ni.id); }
  for (const s of inc.students) {
    const hs = p.stuMap.get(s.id);
    for (const it of inc.items) {
      const hi = p.itemMap.get(it.id); if (!hs || !hi) continue;
      const v = getG(inc, s.id, it.id);
      if (v !== '') {
        const hv = getG(c, hs, hi);
        if (hv === '' || choice.get(`g|${s.id}|${it.id}`) === 'inc') { setRaw(c, hs, hi, v); setMod(c, hs, hi, getMod(inc, s.id, it.id)); }
      }
      const n = getNote(inc, s.id, it.id);
      if (n && (!getNote(c, hs, hi) || choice.get(`n|${s.id}|${it.id}`) === 'inc')) setNoteRaw(c, hs, hi, clone(n));
    }
  }
  if (opts.drop) for (const [s, m] of p.drop) { m.dropped = true; m.droppedAt = s.droppedAt || Date.now(); }
  if (opts.undrop) for (const [, m] of p.undrop) { m.dropped = false; m.droppedAt = null; }
  for (const it of inc.items) { const h = itemById(c, p.itemMap.get(it.id)); if (h) { h.exportedAt = Math.max(h.exportedAt || 0, it.exportedAt || 0) || null; if (!h.bsHeader && it.bsHeader) { h.bsHeader = it.bsHeader; h.bsName = it.bsName; } } }
  for (const e of inc.emails) if (!c.emails.some(x => x.id === e.id)) c.emails.push({...clone(e), to: e.to.map(id => p.stuMap.get(id)).filter(Boolean), iid: e.iid ? p.itemMap.get(e.iid) || null : null});
  c.emails.sort((a, b) => a.at - b.at);
  if (!weighted(c).length && weighted(inc).length) c.grading = clone(inc.grading);
  if (!c.bsImportUrl && inc.bsImportUrl) c.bsImportUrl = inc.bsImportUrl;
  sortStudents(c); syncCats(c);
}
function startRestore(pkg, sourceLabel, defMode = 'merge') {
  if (!pkg || pkg.app !== 'Gradebook' || !pkg.data || !Array.isArray(pkg.data.classes)) { toast('That file isn\'t a Gradebook backup', {warn: true}); return; }
  const incoming = migrate(clone(pkg.data));
  const st = {mode: defMode, ids: new Set(incoming.classes.map(x => x.id)), all: false, drop: true, undrop: false, choice: new Map()};
  const plans = () => incoming.classes.filter(x => st.ids.has(x.id)).map(x => planMerge(findHere(x), x));
  const render = d => {
    const ps = st.mode === 'merge' ? plans() : [];
    const confl = ps.flatMap(p => p.conflicts.map(x => ({...x, p})));
    for (const x of confl) if (!st.choice.has(x.key)) st.choice.set(x.key, x.incAt > x.hereAt ? 'inc' : 'here');
    const nDrop = ps.reduce((a, p) => a + p.drop.length, 0), nUndrop = ps.reduce((a, p) => a + p.undrop.length, 0);
    const rows = incoming.classes.slice().sort((a, b) => natCmp(a.name, b.name)).map(x => {
      const here = findHere(x), p = ps.find(q => q.inc === x);
      const status = !here ? '<span class="tag new">added</span>' : st.mode === 'replace' ? `<span class="tag chg">replaces ${esc(here.name)}</span>`
        : p ? `<span class="tag okk">merges into ${esc(here.name)}</span> <span class="dim" style="font-size:12px">${[p.newStu.length && plural(p.newStu.length, 'new student'), p.newItems.length && plural(p.newItems.length, 'new item'), p.fills && plural(p.fills, 'grade'), p.noteFills && plural(p.noteFills, 'note'), p.emails && plural(p.emails, 'email log entry', 'email log entries'), p.conflicts.length && `<span class="warn">${plural(p.conflicts.length, 'difference')}</span>`].filter(Boolean).join(' · ') || 'nothing new'}</span>` : '';
      return `<tr><td><input type="checkbox" data-rc="${x.id}" ${st.ids.has(x.id) ? 'checked' : ''}></td><td><b>${esc(x.name)}</b></td><td class="r">${x.students.length}</td><td class="r">${x.items.length}</td><td>${status}</td></tr>`;
    }).join('');
    $('.dlg-b', d).innerHTML = `<p class="muted" style="margin-top:0">${esc(sourceLabel)} · saved ${esc(new Date(pkg.savedAt).toLocaleString())}</p>
      <div class="seg" style="margin-bottom:10px"><button class="${st.mode === 'merge' ? 'on' : ''}" data-rm="merge">Merge</button><button class="${st.mode === 'replace' ? 'on' : ''}" data-rm="replace">Replace</button></div>
      <p class="dim" style="margin:0 0 10px;font-size:12.5px">${st.mode === 'merge' ? 'Merge never removes anything here. It adds the students, items, grades, notes and email log entries the backup has and this browser doesn\'t. Where both have a different value for the same cell, you choose below.' : 'Replace swaps each checked class for the backup\'s copy. Anything added here since the backup is lost from those classes.'} An automatic copy of the current data is made first.</p>
      <div class="tblwrap"><table class="list"><thead><tr><th></th><th>Class in the backup</th><th class="r">Students</th><th class="r">Items</th><th>Here</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${st.mode === 'merge' ? `${nDrop || nUndrop ? `<div style="margin-top:10px">${nDrop ? `<label class="row"><input type="checkbox" id="rs-drop" ${st.drop ? 'checked' : ''}> Drop ${plural(nDrop, 'student')} who ${nDrop === 1 ? 'is' : 'are'} dropped in the backup</label>` : ''}${nUndrop ? `<label class="row" style="margin-top:4px"><input type="checkbox" id="rs-undrop" ${st.undrop ? 'checked' : ''}> Restore ${plural(nUndrop, 'student')} dropped here but active in the backup</label>` : ''}</div>` : ''}
        ${confl.length ? `<div class="note warn" style="margin-top:12px"><div class="row"><b>${plural(confl.length, 'value differs', 'values differ')}</b>. The newer edit is picked for you.<div class="grow"></div><button class="btn small" data-rall="here">Keep all here</button><button class="btn small" data-rall="inc">Use all backup</button></div></div>
          <div class="tblwrap" style="max-height:40vh"><table class="list"><thead><tr><th>Class</th><th>Student</th><th>Item</th><th>Here</th><th>In the backup</th></tr></thead><tbody>${confl.map(x => `<tr><td class="dim">${esc(x.p.here.name)}</td><td>${fullName(x.s)}</td><td>${esc(x.it.name)}${x.f === 'n' ? ' <span class="tag">note</span>' : ''}</td>
            <td><label><input type="radio" name="rc-${esc(x.key)}" data-rch="${esc(x.key)}" value="here" ${st.choice.get(x.key) === 'here' ? 'checked' : ''}> ${esc(x.here)} <span class="dim" style="font-size:11.5px">${x.hereAt ? esc(fmtDate(x.hereAt)) : ''}</span></label></td>
            <td><label><input type="radio" name="rc-${esc(x.key)}" data-rch="${esc(x.key)}" value="inc" ${st.choice.get(x.key) === 'inc' ? 'checked' : ''}> ${esc(x.inc)} <span class="dim" style="font-size:11.5px">${x.incAt ? esc(fmtDate(x.incAt)) : ''}</span></label></td></tr>`).join('')}</tbody></table></div>` : ''}`
      : `<label class="row" style="margin-top:12px"><input type="checkbox" id="rs-all" ${st.all ? 'checked' : ''}> Replace <b>everything</b> in this browser (classes not checked here are removed, and templates and settings come from the backup)</label>`}`;
  };
  openDialog({title: 'Restore from backup', wide: 900, body: '',
    buttons: [{label: 'Cancel'}, {label: 'Restore', primary: true, onClick: () => {
      if (!st.ids.size && !(st.mode === 'replace' && st.all)) { toast('Check at least one class', {warn: true}); return false; }
      const snap = JSON.stringify(DB);
      snapshot('before', `Before restoring ${sourceLabel}`);
      const pick = incoming.classes.filter(x => st.ids.has(x.id));
      const label = `Restore: ${sourceLabel}`;
      if (st.mode === 'merge') {
        for (const p of plans()) {
          const before = p.here ? clone(p.here) : null;
          applyMerge(p, st.choice, {drop: st.drop, undrop: st.undrop});
          if (p.here) { logDiff(p.here, before, 'merge', label); unionHist(histOf(p.here.id), incoming.hist[p.inc.id], p.stuMap, p.itemMap); }
          else { const nc = DB.classes[DB.classes.length - 1]; unionHist(histOf(nc.id), incoming.hist[p.inc.id]); }
        }
        for (const t of incoming.templates) if (!DB.templates.some(x => x.id === t.id) && !DB.removedStarters.includes(t.id)) DB.templates.push(clone(t));
        for (const e of incoming.bin) if (!DB.bin.some(x => x.id === e.id)) DB.bin.push(clone(e));
        for (const k of DETAIL_KEYS) if (!DB.me[k] && incoming.me[k]) DB.me[k] = incoming.me[k];
      } else if (st.all) {
        const nd = incoming; nd.classes = pick; nd.ui = DB.ui; nd.lastBackupAt = DB.lastBackupAt; replaceDB(nd, 'restore', label);
      } else for (const x of pick) {
        const h = findHere(x); const i = h ? DB.classes.indexOf(h) : -1; const nx = fixClass(clone(x));
        if (i >= 0) { const before = clone(h); nx.id = h.id; DB.classes[i] = nx; logDiff(nx, before, 'restore', label); unionHist(histOf(nx.id), incoming.hist[x.id]); }
        else { DB.classes.push(nx); unionHist(histOf(nx.id), incoming.hist[x.id]); }
      }
      if (!DB.classes.find(k => k.id === DB.cur)) DB.cur = (pick[0] && (findHere(pick[0]) || {}).id) || DB.classes[0]?.id || null;
      DB.editsSinceBackup++; LOAD_PROBLEM = null; S.imp = null; save(); loadUI(); renderAll();
      toast(`${st.mode === 'merge' ? 'Merged' : 'Restored'} ${plural(pick.length, 'class', 'classes')}`, {action: {label: 'Undo', fn: () => { replaceDB(migrate(JSON.parse(snap)), 'undo', `Undo ${label.toLowerCase()}`); save(); loadUI(); renderAll(); toast('Restore undone'); }}});
    }}],
    onOpen: d => {
      render(d);
      d.querySelector('.dlg-b').addEventListener('click', e => {
        const m = e.target.closest('[data-rm]'); if (m) { st.mode = m.dataset.rm; render(d); return; }
        const ra = e.target.closest('[data-rall]'); if (ra) { for (const p of plans()) for (const x of p.conflicts) st.choice.set(x.key, ra.dataset.rall); render(d); }
      });
      d.querySelector('.dlg-b').addEventListener('change', e => {
        const t = e.target;
        if (t.dataset.rc) { t.checked ? st.ids.add(t.dataset.rc) : st.ids.delete(t.dataset.rc); render(d); }
        else if (t.dataset.rch) st.choice.set(t.dataset.rch, t.value);
        else if (t.id === 'rs-drop') st.drop = t.checked; else if (t.id === 'rs-undrop') st.undrop = t.checked; else if (t.id === 'rs-all') st.all = t.checked;
      });
    }});
}
async function restoreFile(text, fname) {
  let pkg; try { pkg = JSON.parse(text); } catch { toast('That file isn\'t a Gradebook backup', {warn: true}); return; }
  startRestore(pkg, fname, 'merge');
}
$('#bakFile').addEventListener('change', async e => { const f = e.target.files[0]; e.target.value = ''; if (f) restoreFile(await f.text(), f.name); });

/* ================= Drag & drop ================= */
let dragN = 0;
const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
document.addEventListener('dragenter', e => { if (!hasFiles(e)) return; dragN++; $('#dropOverlay').classList.add('on'); });
document.addEventListener('dragleave', e => { if (!hasFiles(e)) return; if (--dragN <= 0) { dragN = 0; $('#dropOverlay').classList.remove('on'); } });
document.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
document.addEventListener('drop', async e => {
  if (!hasFiles(e)) return; e.preventDefault(); dragN = 0; $('#dropOverlay').classList.remove('on');
  const f = e.dataTransfer.files[0]; if (!f) return;
  if (document.querySelector('dialog[open]')) return;
  const text = await f.text();
  if (/\.json$/i.test(f.name) || /^\s*\{/.test(text)) restoreFile(text, f.name); else startImport(text, f.name);
});

function helpDialog() {
  openDialog({title: 'About Gradebook', wide: 720, body: `<div class="help">
   <p>A gradebook for your classes that runs entirely in this browser. Brightspace is where grades get posted; this app is where you keep and enter them.</p>
   <h3>Typical workflow</h3><ul>
    <li><b>Start a class</b> by importing a Brightspace grades export (Export &amp; import). It brings in the students and any Points or Text grade items.</li>
    <li><b>Set up the course grade</b> in Set up class: category weights, drop-lowest, letter cutoffs, the passing grade and the at-risk rules.</li>
    <li><b>Enter grades</b> in the grid: filter to the item, type the score, press Enter for the next student. Type <b>EX</b> for excused. Press <b>N</b> to leave a note on a cell.</li>
    <li><b>Check on students</b> in Course grades: who is at risk, who to watch, and why. Click a student for a printable summary.</li>
    <li><b>Email students</b> in Send emails: pick who's missing an item, scored low, or is at risk, choose a template, and open drafts in your mail app. Nothing is sent automatically.</li>
    <li><b>Export for Brightspace</b> (<b>${CMD}B</b> from any tab): pick the items (changed ones are pre-checked) and import the CSV in Brightspace's Grades → Import.</li></ul>
   <h3>Course grade</h3><p>Each weighted category's average (equal weight per item, or total points) is multiplied by its weight. A blank counts as 0 once any classmate has a score on that item; until then the item is left out. EX never counts. Without weights, the course grade is total points so far.</p>
   <h3>Avg %</h3><p>Points earned ÷ points possible over the items currently shown, counting only items with a score. It's a quick filter tool, separate from the course grade.</p>
   <h3>Your data</h3><p>Everything is saved automatically in this browser on this computer, and nothing is uploaded. Press <b>${CMD}S</b> (or Manage data → Download backup) regularly; the header turns amber after a week without one. Every grade and note change is recorded in <b>History</b> (🕘 under the grid, or <b>H</b>), where any change can be reverted, or moved to the right student or item. The app also keeps automatic copies (one per day for 7 days, and one before every restore or import), a 30-day Recently deleted bin, and never overwrites saved data it can't read.</p></div>`});
}
$('#helpBtn').addEventListener('click', helpDialog);
$('#keysBtn').addEventListener('click', keysDialog);
